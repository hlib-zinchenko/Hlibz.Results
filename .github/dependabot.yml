# Weekly, grouped: one PR for all NuGet updates, one for all GitHub Actions, one for the SDK.
# CI runs the tests on every PR, so a green check is what makes these safe to merge.
# FluentValidation is a deliberately low minimum (see Directory.Packages.props), never bumped.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: FluentValidation
    groups:
      nuget:
        patterns: ["*"]
  # The SDK pinned in global.json: one PR per new patch, which CI then builds with it.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
