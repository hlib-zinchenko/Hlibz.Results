name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The SDK global.json pins, plus the .NET 10 runtime the net10.0 tests run on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The sample's error code files are committed build output: the build must not change them.
      - name: Sample error code files are current
        run: |
          git status --porcelain -- samples
          test -z "$(git status --porcelain -- samples)"

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      # Each package must carry the README and icon nuget.org shows.
      - name: Package contents
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "$package"
            unzip -l "$package" > contents.txt
            grep -qE " README\.md$" contents.txt
            grep -qE " icon\.png$" contents.txt
            unzip -p "$package" '*.nuspec' > package.nuspec
            grep -q "<readme>README.md</readme>" package.nuspec
            grep -q "<icon>icon.png</icon>" package.nuspec
          done
          test "$(ls ./artifacts/*.nupkg | wc -l)" -eq 3
          # The source generator ships inside Hlibz.Results, with the target that adds it to a
          # project that gets the package indirectly.
          unzip -l ./artifacts/Hlibz.Results.[0-9]*.nupkg > contents.txt
          grep -qE " analyzers/dotnet/cs/Hlibz\.Results\.Generators\.dll$" contents.txt
          grep -qE " buildTransitive/Hlibz\.Results\.targets$" contents.txt
          # The build-time error code files tool ships inside Hlibz.Results.AspNetCore, with the
          # target that runs it.
          unzip -l ./artifacts/Hlibz.Results.AspNetCore.[0-9]*.nupkg > contents.txt
          grep -qE " tools/Hlibz\.Results\.AspNetCore\.ErrorCodeFiles\.dll$" contents.txt
          grep -qE " buildTransitive/Hlibz\.Results\.AspNetCore\.targets$" contents.txt

      # A project that gets the packages only indirectly compiles with the packed generator.
      - name: Packed generator
        run: .github/scripts/check-packed-generator.sh ./artifacts

      # A web app on the packed package writes its error code files at build time.
      - name: Packed error code files
        run: .github/scripts/check-packed-error-code-files.sh ./artifacts
