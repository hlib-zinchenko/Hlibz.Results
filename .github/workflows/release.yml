name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          # The SDK global.json pins, plus the .NET 10 runtime the net10.0 tests run on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Determine package version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      # Built once at the tag's version: the tests run on these binaries, and Pack packs them.
      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Every package in the repo shares the version, so one tag releases them together.
      - name: Pack
        run: >
          dotnet pack
          --no-build
          --configuration Release
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
